name: Daily posts (5 per day)

on:
  schedule:
    # UTC times -> IST: 08:53, 11:53, 14:53, 17:53, 20:53
    - cron: "23 3 * * *"
    - cron: "23 6 * * *"
    - cron: "23 9 * * *"
    - cron: "23 12 * * *"
    - cron: "23 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sirf test karo, publish mat karo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Render new posts (agar content mein naye posts hain)
        run: python scripts/render.py

      - name: Push rendered images
        run: |
          git config user.name "daily-posts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts
          if ! git diff --cached --quiet; then
            git commit -m "Render new post images"
            git push
            sleep 20
          fi

      - name: Publish next post
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/publish.py

      - name: Save state
        if: always()
        run: |
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Published post $(date -u +%F_%H%M)"
            git pull --rebase
            git push
          fi
